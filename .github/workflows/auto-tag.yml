name: Auto-tag

# On push to main: read the merged PR's version label, compute the next semver
# tag, push the new vX.Y.Z tag, force-move the rolling vX tag, and create a
# GitHub Release. Replaces the manual four-step recipe in README §Releasing.
#
# The fallback chain mirrors the reusable release.yml in this repo:
#   1. PR label (major / minor / patch)
#   2. commit-message marker ([major], [minor], major:, minor:)
#   3. default = patch
#
# Concurrency: serialise (no cancel) so two pushes landing back-to-back can't
# both compute the same "next tag" and race the push.

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            level:
                description: 'Override bump level'
                required: false
                default: 'patch'
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: auto-tag
    cancel-in-progress: false

jobs:
    tag:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Determine bump level
              id: level
              env:
                  GH_TOKEN: ${{ github.token }}
                  DISPATCH_LEVEL: ${{ inputs.level }}
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "level=$DISPATCH_LEVEL" >> "$GITHUB_OUTPUT"
                      echo "source=workflow_dispatch" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  pr_number=$(gh pr list --state merged --json number,mergeCommit \
                      --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number" | head -n1)

                  level=""
                  source="default"
                  if [ -n "$pr_number" ]; then
                      labels=$(gh pr view "$pr_number" --json labels --jq '(.labels // []) | map(.name) | join(",")')
                      if [[ "$labels" == *"major"* ]]; then
                          level="major"; source="pr-label"
                      elif [[ "$labels" == *"minor"* ]]; then
                          level="minor"; source="pr-label"
                      elif [[ "$labels" == *"patch"* ]]; then
                          level="patch"; source="pr-label"
                      fi
                  fi

                  if [ -z "$level" ]; then
                      msg=$(git log -1 --pretty=%B)
                      if [[ "$msg" == *"[major]"* || "$msg" == *"major:"* ]]; then
                          level="major"; source="commit-msg"
                      elif [[ "$msg" == *"[minor]"* || "$msg" == *"minor:"* ]]; then
                          level="minor"; source="commit-msg"
                      else
                          level="patch"
                      fi
                  fi

                  echo "level=$level" >> "$GITHUB_OUTPUT"
                  echo "source=$source" >> "$GITHUB_OUTPUT"
                  echo "Bump: $level (source: $source)"

            - name: Compute next version
              id: version
              env:
                  LEVEL: ${{ steps.level.outputs.level }}
              run: |
                  git fetch --tags --force --quiet
                  latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
                  if [ -z "$latest" ]; then
                      latest="v0.0.0"
                  fi

                  ver="${latest#v}"
                  IFS='.' read -r major minor patch <<<"$ver"
                  case "$LEVEL" in
                      major) major=$((major + 1)); minor=0; patch=0 ;;
                      minor) minor=$((minor + 1)); patch=0 ;;
                      patch) patch=$((patch + 1)) ;;
                      *) echo "::error::Unknown bump level '$LEVEL'"; exit 1 ;;
                  esac

                  next="v${major}.${minor}.${patch}"
                  rolling="v${major}"

                  echo "previous=$latest" >> "$GITHUB_OUTPUT"
                  echo "next=$next" >> "$GITHUB_OUTPUT"
                  echo "rolling=$rolling" >> "$GITHUB_OUTPUT"
                  echo "$latest -> $next (rolling tag: $rolling)"

            - name: Push tags
              env:
                  NEXT: ${{ steps.version.outputs.next }}
                  ROLLING: ${{ steps.version.outputs.rolling }}
                  LEVEL: ${{ steps.level.outputs.level }}
              run: |
                  if git rev-parse "$NEXT" >/dev/null 2>&1; then
                      echo "::error::Tag $NEXT already exists at $(git rev-parse "$NEXT"). Refusing to overwrite."
                      exit 1
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'

                  git tag -a "$NEXT" -m "Release $NEXT ($LEVEL)"
                  git tag -f "$ROLLING" "$NEXT"

                  git push origin "$NEXT"
                  git push origin "$ROLLING" --force

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.next }}
                  name: Release ${{ steps.version.outputs.next }}
                  body: |
                      Automated release.

                      - Previous tag: `${{ steps.version.outputs.previous }}`
                      - Bump: **${{ steps.level.outputs.level }}** (source: `${{ steps.level.outputs.source }}`)
                      - Rolling tag updated: `${{ steps.version.outputs.rolling }}` → `${{ steps.version.outputs.next }}`

                      Commit:
                      ${{ github.event.head_commit.message }}
                  draft: false
                  prerelease: false
