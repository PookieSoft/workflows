name: Dependabot auto-label (reusable)

# Reusable workflow that strips `major`/`minor` labels Dependabot auto-applies
# when those labels exist in the repository, and ensures `patch` is set instead.
# All Dependabot PRs are treated as patch-level downstream regardless of the
# dependency's actual semver bump.
#
# Caller example:
#
#   on:
#       pull_request_target:
#           types: [opened, reopened, labeled]
#   permissions:
#       pull-requests: write
#   jobs:
#       auto-label:
#           uses: PookieSoft/workflows/.github/workflows/dependabot-auto-label.yml@v1
#           secrets: inherit

on:
    workflow_call:

jobs:
    enforce-patch-only:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: Set patch as the only version label
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label major || true
                  gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label minor || true
                  gh pr edit "$PR_NUMBER" -R "$REPO" --add-label patch
